name: Action CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate action metadata and contract
        shell: bash
        run: bash tests/validate-action.sh action.yml
      - name: Check required documentation
        shell: bash
        run: test -s README.md && test -s LICENSE
